load_module /usr/share/nginx/modules/ngx_http_image_filter_module.so;

events {}

user root;
http{
	include /etc/nginx/mime.types;
	
	# Configuração de memory-cache para armazenar as imagens processadas em memória, evitando o acesso ao disco.
	proxy_cache_path /dev/shm/nginx-cache
		levels=1:2
		keys_zone=imagem_memoria:200m
		max_size=200m
		inactive=1h
		use_temp_path=off;
	
	server{
		listen 8000;
		server_name 127.0.0.1;
		root /home/curso-nginx/galeria-fotos/;
		index index.html index.htm;

		# NO-CACHE
		# o cache do navegador é DESABILITADO
		location ~ "^/no-cache/(?<image>.+)$" {
			alias /home/curso-nginx/galeria-fotos/$image;
			add_header Last-Modified $date_gmt;
		 	add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
		}

		# CACHE
		# o cache do navegador é HABILITADO
		location ~ "^/cache/(?<image>.+)$" {
			alias /home/curso-nginx/galeria-fotos/$image;
			add_header Last-Modified $date_gmt;
		 	add_header Cache-Control public;
			#expires 5m;
			expires @23h59m;
		}
	
		#CACHE NA MEMORIA DO SERVIDOR
		location ~ "^/cache-em-memoria/(?<image>.+)$" {
			alias /home/curso-nginx/galeria-fotos/$image;
			add_header Last-Modified $date_gmt;
		 	add_header Cache-Control public;
			expires @23h59m;
			image_filter resize 200 200;
			image_filter_jpeg_quality 80;
		}


		# THUMBNAIL
		# Gera uma miniatura da imagem, com 90% de qualidade
		location ~ "^/thumbnail/(?P<width>[0-9]+)/(?<image>.+)$" {
			alias /home/curso-nginx/galeria-fotos/$image;
			image_filter resize $width -;
			image_filter_jpeg_quality 90;

			image_filter_buffer 20M; # Utiliza até 20MB de memória p/ carregar a imagem, antes de aplicar o resize.
		}

	    # THUMBNAIL + QUALIDADE
		location ~ "^/resize/(?P<quality>[0-9]+)/(?<image>.+\.jpg)$" {
			root /home/curso-nginx/galeria-fotos;
			rewrite ^/resize/[0-9]+/(.+)$ /$1 break;
			
			image_filter resize 1024 -;
			image_filter_jpeg_quality $quality;

			image_filter_buffer 20M;
		}

		location ~ "^/cache-em-memoria/(?<image>.+)$" {
			proxy_cache imagem_memoria;
			 proxy_cache_key $uri;
			 proxy_cache_valid 200 1h;
default_type image/jpeg;

			 proxy_cache_use_stale error timeout updating;
			 proxy_cache_lock on;

			 add_header X-Cache $upstream_cache_status;

			proxy_pass http://dell:8000/$image;
		}
	}

	

}